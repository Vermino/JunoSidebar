<!-- File: JunoSidebar.React/public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
            name="description"
            content="Juno Sidebar - Windows-native React UI"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Juno Sidebar</title>
    <!-- Import Tailwind CSS - This will be replaced with a proper build in production -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'slide-in': 'slideIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        slideIn: {
                            '0%': { transform: 'translateX(100%)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- WebView2 communication script - ensures communication works even before React loads -->
    <script>
        window.addEventListener('message', function(event) {
            console.log('Message received before React initialization:', event.data);
        });
        function isRunningInWebView2() {
            return 'chrome' in window && 'webview' in window.chrome;
        }
        console.log('Juno Sidebar initializing. Running in WebView2:', isRunningInWebView2());
    </script>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<!-- React will mount to the root div -->
</body>
</html>
